<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIゴルフコーチ 試験</title>
<style>body{font-family:system-ui,sans-serif;margin:16px;background:#fff;color:#111}.ok{color:#1f6f4a}.ng{color:#c00;font-weight:600}</style></head>
<body>
<h1>coach-core の試験</h1>
<div id="sum"></div><ol id="out"></ol>
<script src="coach-data.js"></script>
<script src="coach-core.js"></script>
<script>
var C = window.CoachCore, D = window.COACH_DATA, n = 0, ng = 0;
function t(name, cond, info) {
  n++; if (!cond) ng++;
  var li = document.createElement("li"); li.className = cond ? "ok" : "ng";
  li.textContent = (cond ? "OK " : "NG ") + name + (info ? "：" + info : ""); document.getElementById("out").appendChild(li);
}
// データ
t("板は 54 回", D.lessons.length === 54, D.lessons.length);
t("最初の板は 2025/10/1", D.lessons[0].date === "2025/10/1");
t("最後の板は 2026/10/29", D.lessons[53].date === "2026/10/29");
t("12/21 までは 2025 年", D.lessons[15].date === "2025/12/21");
t("1/6 からは 2026 年", D.lessons[16].date === "2026/1/6");
t("月が切れた板に印", D.lessons[18].unsureDate && D.lessons[38].unsureDate);
t("処方は 13 行", D.prescriptions.length === 13, D.prescriptions.length);
t("ドリルは 12 行", D.drills.length === 12, D.drills.length);
// system
var sys = C.buildSystem(D);
t("system は 1 つでキャッシュ指定", sys.length === 1 && sys[0].cache_control.type === "ephemeral");
t("system に規則・要点・記録", sys[0].text.indexOf("AIゴルフコーチ") >= 0 && sys[0].text.indexOf("<教えの要点>") >= 0 && sys[0].text.indexOf("No.54") >= 0);
t("system は毎回同じ", C.buildSystem(D)[0].text === sys[0].text);
// 要求
var h = [{ role: "user", content: "x" }];
var r1 = C.buildRequest({ model: "claude-opus-5-5", effort: "medium", system: sys, history: h });
t("Opus は fallbacks default", r1.fallbacks === "default" && r1.betas[0] === C.FALLBACK_BETA);
t("thinking は送らない（Opus 5.5 は常に adaptive）", !("thinking" in r1));
t("effort は output_config に", r1.output_config.effort === "medium");
var r2 = C.buildRequest({ model: "claude-haiku-5-5", system: sys, history: h });
t("Haiku は fallbacks なし", !("fallbacks" in r2) && !("betas" in r2));
t("知らないモデルは Opus へ", C.buildRequest({ model: "zzz", system: sys, history: h }).model === "claude-opus-5-5");
// 板から探す
t("ダフリ → 最下点の処方", C.matchOffline("7番でダフります", D)[0].worry === "ダフる・薄い");
t("引っかけ → 左へ引っかける", C.matchOffline("左に引っかける", D)[0].worry === "左へ引っかける");
t("パター → パター", C.matchOffline("3パットが多い", D)[0].worry === "パター");
t("全角英数でも当たる", C.matchOffline("ＯＢが多いドライバー", D)[0].worry === "ドライバーが安定しない");
t("合わない言葉は 0 件", C.matchOffline("今日の天気", D).length === 0);
t("合わない言葉は原点の板", C.offlineBoard("今日の天気", D).indexOf("原点") >= 0);
t("処方の板に参考の日付", /参考：.*の板/.test(C.offlineBoard("バンカーが苦手", D)));
// 表示
var html = C.renderBoard("☆ **最下点** をそろえる\n↳ 右膝\n‖ 厚く\nQ なぜ\n参考：2026/1/8 の板\n| a | b |\n|---|---|\n| 1 | 2 |\n<script>");
t("太字は赤", html.indexOf('<strong class="red">最下点</strong>') >= 0);
t("行の種類", html.indexOf("b-theme") >= 0 && html.indexOf("b-step") >= 0 && html.indexOf("b-eq") >= 0 && html.indexOf("b-why") >= 0 && html.indexOf("b-ref") >= 0);
t("表になる（区切り行は除く）", html.indexOf("<table") >= 0 && html.indexOf("---") < 0);
t("HTML は無害化", html.indexOf("<script>") < 0 && html.indexOf("&lt;script&gt;") >= 0);
t("textOf は text だけ", C.textOf({ content: [{ type: "thinking", thinking: "" }, { type: "text", text: "あ" }, { type: "text", text: "い" }] }) === "あい");
document.getElementById("sum").innerHTML = '<p class="' + (ng ? "ng" : "ok") + '">' + (n - ng) + " / " + n + " 件 OK</p>";
window.__result = { n: n, ng: ng };
</script>
</body>
</html>
