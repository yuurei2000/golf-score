<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゴルフビンゴ 試験</title>
<script src="bingo-core.js"></script>
<style>
:root { --bg: #fff; --ink: #222; --ok: #1d7a3e; --ng: #c0392b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151a17; --ink: #e5ece7; --ok: #5fd08a; --ng: #ff8070; } }
:root[data-theme="dark"] { --bg: #151a17; --ink: #e5ece7; --ok: #5fd08a; --ng: #ff8070; }
body { background: var(--bg); color: var(--ink); font-family: sans-serif; padding: 16px; }
.ok { color: var(--ok); } .ng { color: var(--ng); font-weight: bold; }
</style>
</head>
<body>
<h1>ゴルフビンゴ 試験</h1>
<div id="out"></div>
<script>
var B = window.BingoCore, results = [];
function t(name, fn) {
  try { var r = fn(); results.push({ name: name, ok: r === true, msg: r === true ? "" : String(r) }); }
  catch (e) { results.push({ name: name, ok: false, msg: e.message }); }
}

t("出来事の数がカードに足りる", function () {
  return B.ITEMS.easy.length >= B.PER_CARD.easy && B.ITEMS.mid.length >= B.PER_CARD.mid && B.ITEMS.hard.length >= B.PER_CARD.hard
    && (B.PER_CARD.easy + B.PER_CARD.mid + B.PER_CARD.hard === 24) || "数が合わない";
});
t("出来事に重複が無い", function () {
  var all = B.ITEMS.easy.concat(B.ITEMS.mid, B.ITEMS.hard), s = {};
  for (var i = 0; i < all.length; i++) { if (s[all[i]]) return "重複 " + all[i]; s[all[i]] = 1; }
  return true;
});
t("列は 12 本・どれも 5 マス", function () {
  return B.LINES.length === 12 && B.LINES.every(function (l) { return l.length === 5; }) || "列の数が違う";
});

var codes = ["K7Q2M", "ABCDE", "GOLF1", "Z9Z9Z", "HANAMI"];
codes.forEach(function (code) {
  var cards = B.generateCards(code, 16);
  t(code + "：16 枚できる", function () { return cards.length === 16 && cards.every(function (c) { return c && c.length === 25; }) || "枚数か大きさが違う"; });
  t(code + "：真ん中は FREE", function () { return cards.every(function (c) { return c[12] === B.FREE; }) || "FREE でない"; });
  t(code + "：1 枚の中に同じ出来事が無い", function () {
    return cards.every(function (c) { var s = {}; return c.every(function (x) { if (s[x]) return false; s[x] = 1; return true; }); }) || "重複あり";
  });
  t(code + "：やさしい 10・ふつう 9・むずかしい 5", function () {
    return cards.every(function (c) {
      var n = { easy: 0, mid: 0, hard: 0, free: 0 }; c.forEach(function (x) { n[B.tierOf(x)]++; });
      return n.easy === 10 && n.mid === 9 && n.hard === 5 && n.free === 1;
    }) || "段の数が違う";
  });
  t(code + "：どの列もやさしい 1 個以上・むずかしい 2 個まで", function () { return cards.every(B.fairLayout) || "偏りあり"; });
  var d = B.diversity(cards);
  t(code + "：同じカードが無い", function () { return d.duplicates === 0 || d.duplicates + " 組"; });
  t(code + "：同じ位置に同じ出来事の組が無い", function () { return d.samePosPairs === 0 || d.samePosPairs + " 組"; });
  t(code + "：同じ列に 3 個以上同じ出来事の組が無い", function () { return d.lineSimPairs === 0 || d.lineSimPairs + " 組"; });
  t(code + "：2 枚で重なる出来事は最大 8 個まで（平均 " + d.avgShared.toFixed(1) + "・最大 " + d.maxShared + "）", function () { return d.maxShared <= 8 || "最大 " + d.maxShared; });
});

t("同じコードなら同じ 16 枚", function () {
  var a = JSON.stringify(B.generateCards("SAME1", 16));
  // 覚えを使わずに作り直すため、別の枚数で作ってから比べる
  var b = JSON.stringify(B.generateCards("SAME1", 16));
  return a === b || "違う";
});
t("違うコードなら違うカード", function () {
  return JSON.stringify(B.generateCards("AAAAA", 16)[0]) !== JSON.stringify(B.generateCards("BBBBB", 16)[0]) || "同じ";
});

t("印なし：ビンゴ 0・リーチ 0", function () { var r = B.evaluate({}); return r.bingo.length === 0 && r.reach.length === 0 && r.marks === 0 || JSON.stringify(r); });
t("真ん中の列は 4 マスでビンゴ", function () {
  var r = B.evaluate({ 10: 1, 11: 1, 13: 1, 14: 1 }); return r.bingo.length === 1 && r.marks === 4 || JSON.stringify(r);
});
t("斜めは 3 マスでリーチ", function () {
  var r = B.evaluate({ 0: 1, 6: 1, 18: 1 }); return r.bingo.length === 0 && r.reach.indexOf(10) >= 0 || JSON.stringify(r);
});
t("1 行目がそろえばビンゴ", function () {
  var r = B.evaluate({ 0: 1, 1: 1, 2: 1, 3: 1, 4: 1 }); return r.bingo.indexOf(0) >= 0 || JSON.stringify(r);
});
t("全部開けばビンゴ 12 本", function () {
  var m = {}; for (var i = 0; i < 25; i++) if (i !== 12) m[i] = 1; return B.evaluate(m).bingo.length === 12 || "本数が違う";
});
t("順位：ビンゴ → リーチ → マス", function () {
  var r = B.rank([{ no: 1, bingo: 1, reach: 0, marks: 9 }, { no: 2, bingo: 2, reach: 0, marks: 8 }, { no: 3, bingo: 1, reach: 2, marks: 7 }]);
  return r.map(function (x) { return x.no; }).join(",") === "2,3,1" || r.map(function (x) { return x.no; }).join(",");
});
t("コードの整え方", function () {
  return B.normCode(" k7q-2m ") === "K7Q2M" && B.normCode("ab") === "" && B.normCode("x".repeat(13)) === "" || "整え方が違う";
});
t("新しいコードは 5 文字で、読み違えやすい字を使わない", function () {
  for (var i = 0; i < 200; i++) { var c = B.newCode(); if (!/^[A-HJ-NP-Z2-9]{5}$/.test(c)) return c; }
  return true;
});
t("参加者の色は 16 色とも違う", function () {
  var s = {}; for (var i = 1; i <= 16; i++) { var h = B.playerHue(i); if (s[h]) return "同じ色 " + i; s[h] = 1; } return true;
});

var ok = results.filter(function (r) { return r.ok; }).length;
document.getElementById("out").innerHTML = "<p><b>" + ok + " / " + results.length + "</b></p>" + results.map(function (r) {
  return '<div class="' + (r.ok ? "ok" : "ng") + '">' + (r.ok ? "OK " : "NG ") + r.name + (r.msg ? "：" + r.msg : "") + "</div>";
}).join("");
window.__result = { ok: ok, total: results.length, ng: results.filter(function (r) { return !r.ok; }) };
</script>
</body>
</html>
