<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゴルフビンゴ 試験</title>
<script src="bingo-core.js?v=20261128b"></script>
<style>
:root { --bg: #fff; --ink: #222; --ok: #1d7a3e; --ng: #c0392b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151a17; --ink: #e5ece7; --ok: #5fd08a; --ng: #ff8070; } }
:root[data-theme="dark"] { --bg: #151a17; --ink: #e5ece7; --ok: #5fd08a; --ng: #ff8070; }
body { background: var(--bg); color: var(--ink); font-family: sans-serif; padding: 16px; }
.ok { color: var(--ok); } .ng { color: var(--ng); font-weight: bold; }
</style>
</head>
<body>
<h1>ゴルフビンゴ 試験</h1>
<div id="out"></div>
<script>
var B = window.BingoCore, results = [];
function t(name, fn) {
  try { var r = fn(); results.push({ name: name, ok: r === true, msg: r === true ? "" : String(r) }); }
  catch (e) { results.push({ name: name, ok: false, msg: e.message }); }
}

t("出来事の数がカードに足りる（1 枚 24 個）", function () {
  var sum = 0;
  for (var i = 0; i < B.TIERS.length; i++) { var k = B.TIERS[i]; if (B.ITEMS[k].length < B.PER_CARD[k] * 3) return k + " が少ない"; sum += B.PER_CARD[k]; }
  return sum === 24 || "合計 " + sum;
});
t("ミス（失敗）の出来事がある", function () { return B.ITEMS.miss.length >= 20 && B.ITEMS.miss.indexOf("OB") >= 0 || "ミスが無い"; });
t("出来事に重複が無い", function () {
  var all = [], s = {}; B.TIERS.forEach(function (k) { all = all.concat(B.ITEMS[k]); });
  for (var i = 0; i < all.length; i++) { if (s[all[i]]) return "重複 " + all[i]; s[all[i]] = 1; }
  return true;
});
t("列は 12 本・どれも 5 マス", function () {
  return B.LINES.length === 12 && B.LINES.every(function (l) { return l.length === 5; }) || "列の数が違う";
});

var codes = ["K7Q2M", "ABCDE", "GOLF1", "Z9Z9Z", "HANAMI"];
codes.forEach(function (code) {
  var cards = B.generateCards(code, 16);
  t(code + "：16 枚できる", function () { return cards.length === 16 && cards.every(function (c) { return c && c.length === 25; }) || "枚数か大きさが違う"; });
  t(code + "：真ん中は FREE", function () { return cards.every(function (c) { return c[12] === B.FREE; }) || "FREE でない"; });
  t(code + "：1 枚の中に同じ出来事が無い", function () {
    return cards.every(function (c) { var s = {}; return c.every(function (x) { if (s[x]) return false; s[x] = 1; return true; }); }) || "重複あり";
  });
  t(code + "：やさしい 8・ミス 7・ふつう 6・むずかしい 3", function () {
    return cards.every(function (c) {
      var n = { easy: 0, miss: 0, mid: 0, hard: 0, free: 0 }; c.forEach(function (x) { n[B.tierOf(x)]++; });
      return n.easy === 8 && n.miss === 7 && n.mid === 6 && n.hard === 3 && n.free === 1;
    }) || "段の数が違う";
  });
  t(code + "：どの列もやさしい 1 個以上・むずかしい 1 個まで・ミス 3 個まで", function () { return cards.every(B.fairLayout) || "偏りあり"; });
  var d = B.diversity(cards);
  t(code + "：同じカードが無い", function () { return d.duplicates === 0 || d.duplicates + " 組"; });
  t(code + "：同じ位置に同じ出来事の組が無い", function () { return d.samePosPairs === 0 || d.samePosPairs + " 組"; });
  t(code + "：同じ列に 3 個以上同じ出来事の組が無い", function () { return d.lineSimPairs === 0 || d.lineSimPairs + " 組"; });
  t(code + "：2 枚で重なる出来事は最大 8 個まで（平均 " + d.avgShared.toFixed(1) + "・最大 " + d.maxShared + "）", function () { return d.maxShared <= 8 || "最大 " + d.maxShared; });
});

t("同じコードなら同じ 16 枚", function () {
  var a = JSON.stringify(B.generateCards("SAME1", 16));
  // 覚えを使わずに作り直すため、別の枚数で作ってから比べる
  var b = JSON.stringify(B.generateCards("SAME1", 16));
  return a === b || "違う";
});
t("違うコードなら違うカード", function () {
  return JSON.stringify(B.generateCards("AAAAA", 16)[0]) !== JSON.stringify(B.generateCards("BBBBB", 16)[0]) || "同じ";
});

t("印なし：ビンゴ 0・リーチ 0", function () { var r = B.evaluate({}); return r.bingo.length === 0 && r.reach.length === 0 && r.marks === 0 || JSON.stringify(r); });
t("真ん中の列は 4 マスでビンゴ", function () {
  var r = B.evaluate({ 10: 1, 11: 1, 13: 1, 14: 1 }); return r.bingo.length === 1 && r.marks === 4 || JSON.stringify(r);
});
t("斜めは 3 マスでリーチ", function () {
  var r = B.evaluate({ 0: 1, 6: 1, 18: 1 }); return r.bingo.length === 0 && r.reach.indexOf(10) >= 0 || JSON.stringify(r);
});
t("1 行目がそろえばビンゴ", function () {
  var r = B.evaluate({ 0: 1, 1: 1, 2: 1, 3: 1, 4: 1 }); return r.bingo.indexOf(0) >= 0 || JSON.stringify(r);
});
t("全部開けばビンゴ 12 本", function () {
  var m = {}; for (var i = 0; i < 25; i++) if (i !== 12) m[i] = 1; return B.evaluate(m).bingo.length === 12 || "本数が違う";
});
t("順位：ビンゴ → リーチ → マス", function () {
  var r = B.rank([{ no: 1, bingo: 1, reach: 0, marks: 9 }, { no: 2, bingo: 2, reach: 0, marks: 8 }, { no: 3, bingo: 1, reach: 2, marks: 7 }]);
  return r.map(function (x) { return x.no; }).join(",") === "2,3,1" || r.map(function (x) { return x.no; }).join(",");
});
t("コードの整え方", function () {
  return B.normCode(" k7q-2m ") === "K7Q2M" && B.normCode("ab") === "" && B.normCode("x".repeat(13)) === "" || "整え方が違う";
});
t("新しいコードは 5 文字で、読み違えやすい字を使わない", function () {
  for (var i = 0; i < 200; i++) { var c = B.newCode(); if (!/^[A-HJ-NP-Z2-9]{5}$/.test(c)) return c; }
  return true;
});
t("参加者の色は 16 色とも違う", function () {
  var s = {}; for (var i = 1; i <= 16; i++) { var h = B.playerHue(i); if (s[h]) return "同じ色 " + i; s[h] = 1; } return true;
});

t("参加：空いている番号から引く", function () {
  var seats = {}; for (var i = 1; i <= 15; i++) if (i !== 7) seats[i] = { name: "p" + i, key: "k" + i };
  var r = B.pickSeat(seats, "新しい人", "knew", function () { return 0.99; });
  return r.no === 7 || r.no === 16 ? (r.reused === false || "reused") : "番号 " + r.no;
});
t("参加：16 人がそれぞれ違う番号を引き、17 人目は満員", function () {
  var seats = {}, rnd = B.rng("seat-test");
  for (var i = 0; i < 16; i++) { var r = B.pickSeat(seats, "人" + i, "k" + i, rnd); if (r.full || seats[r.no]) return "重なり " + r.no; seats[r.no] = { name: "人" + i, key: "k" + i }; }
  var r17 = B.pickSeat(seats, "人16", "k16", rnd);
  return Object.keys(seats).length === 16 && r17.full === true || JSON.stringify(r17);
});
t("参加：引く番号はばらける（1 人目の番号が 1 に偏らない）", function () {
  var cnt = {}; for (var i = 0; i < 1600; i++) { var r = B.pickSeat({}, "a", "k", B.rng("s" + i)); cnt[r.no] = (cnt[r.no] || 0) + 1; }
  var ks = Object.keys(cnt); return ks.length === 16 && ks.every(function (k) { return cnt[k] > 50 && cnt[k] < 160; }) || JSON.stringify(cnt);
});
t("参加：同じ端末で入り直すと同じ番号", function () {
  var r = B.pickSeat({ 5: { name: "山田", key: "abc" } }, "別の名前", "abc"); return r.no === 5 && r.reused || JSON.stringify(r);
});
t("参加：同じ名前（空白・全角半角の違いは同じ）なら同じ番号", function () {
  var r = B.pickSeat({ 9: { name: "ヤマダ　タロウ", key: "x" } }, "ヤマダタロウ", "other");
  var r2 = B.pickSeat({ 3: { name: "ABC", key: "x" } }, "ａｂｃ", "other");
  return r.no === 9 && r.reused && r2.no === 3 || JSON.stringify([r, r2]);
});

t("速報：ビンゴが増えたら bingo", function () {
  var e = B.newsEvents({ 3: { name: "A", bingo: 0, reach: 2 } }, { 3: { name: "A", bingo: 1, reach: 1 } });
  return e.length === 1 && e[0].type === "bingo" && e[0].no === 3 && e[0].count === 1 || JSON.stringify(e);
});
t("速報：ビンゴは同じでリーチが増えたら reach", function () {
  var e = B.newsEvents({ 5: { bingo: 0, reach: 0 } }, { 5: { name: "B", bingo: 0, reach: 1 } });
  return e.length === 1 && e[0].type === "reach" && e[0].name === "B" || JSON.stringify(e);
});
t("速報：初めて見た人も、ビンゴ・リーチがあれば出す／変わらなければ出さない", function () {
  var e1 = B.newsEvents({}, { 7: { bingo: 0, reach: 1 }, 8: { bingo: 0, reach: 0 } });
  var e2 = B.newsEvents({ 7: { bingo: 1, reach: 1 } }, { 7: { bingo: 1, reach: 1 } });
  var e3 = B.newsEvents({ 7: { bingo: 1, reach: 2 } }, { 7: { bingo: 1, reach: 1 } });
  return e1.length === 1 && e1[0].no === 7 && e2.length === 0 && e3.length === 0 || JSON.stringify([e1, e2, e3]);
});
t("ミスの数：開いたミスのマスだけ数える", function () {
  var cells = B.generateCards("MISS1", 16)[0], marks = {}, miss = 0;
  cells.forEach(function (x, p) { if (x !== B.FREE) { marks[p] = { hole: 1 }; if (B.tierOf(x) === "miss") miss++; } });
  return B.missCount(cells, marks) === miss && miss === 7 && B.missCount(cells, {}) === 0 || "数が違う " + B.missCount(cells, marks);
});
t("ミス大賞：いちばん多い人（同じ数なら全員）・0 なら無し", function () {
  var a = B.missAward([{ no: 2, miss: 3 }, { no: 9, miss: 5 }, { no: 4, miss: 5 }, { no: 1, miss: 0 }]);
  var b = B.missAward([{ no: 2, miss: 0 }]);
  return a.max === 5 && a.winners.map(function (r) { return r.no; }).join(",") === "4,9" && b.winners.length === 0 || JSON.stringify([a, b]);
});

t("参加：カードが使われている番号（blocked）は引かない", function () {
  for (var s = 0; s < 50; s++) {
    var r = B.pickSeat({ 2: { name: "x", key: "x" } }, "新", "kn", B.rng("b" + s), 16, [1, 13]);
    if (r.no === 1 || r.no === 13 || r.no === 2) return "引いた " + r.no;
  }
  var full = B.pickSeat({}, "新", "kn", Math.random, 2, [1, 2]);
  return full.full === true || JSON.stringify(full);
});
t("席の持ち主：同じ端末の鍵・別の名前で入った鍵・同じ名前は mine、ほかは other、無ければ free", function () {
  var a = B.seatOwner({ name: "やすかわ", key: "dev1" }, "dev1", "ゆういち");
  var b = B.seatOwner({ name: "やすかわ", key: "dev1-ゆういち" }, "dev1", "ゆういち");
  var c = B.seatOwner({ name: "やすかわ", key: "dev2" }, "dev1", "ゆういち");
  var d = B.seatOwner({ name: "ゆういち", key: "dev2" }, "dev1", "ゆういち");
  var e = B.seatOwner(undefined, "dev1", "ゆういち");
  return a === "mine" && b === "mine" && c === "other" && d === "mine" && e === "free" || [a, b, c, d, e].join(",");
});
t("席の記録の無いカード：ほかの人の名前なら blocked・自分の名前や名前なしは入れない", function () {
  var u = B.usedByOthers({ 13: { name: "やすかわ" } }, { 1: { name: "花田" }, 13: { name: "ゆういち" }, 4: { name: "ゆういち" }, 5: { name: "" } }, "ゆういち", 16);
  return u.join(",") === "1" || u.join(",");
});

var ok = results.filter(function (r) { return r.ok; }).length;
document.getElementById("out").innerHTML = "<p><b>" + ok + " / " + results.length + "</b></p>" + results.map(function (r) {
  return '<div class="' + (r.ok ? "ok" : "ng") + '">' + (r.ok ? "OK " : "NG ") + r.name + (r.msg ? "：" + r.msg : "") + "</div>";
}).join("");
window.__result = { ok: ok, total: results.length, ng: results.filter(function (r) { return !r.ok; }) };
</script>
</body>
</html>
